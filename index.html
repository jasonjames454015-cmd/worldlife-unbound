<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WorldLife: Unbound</title>
<style>
:root{--bg:#0d0f14;--card:#161a22;--green:#00e676;--orange:#ffab00;--red:#ff5252;--text:#eef0f4;--muted:#8b93a7;--border:#2a3040;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:10px;padding-bottom:90px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;}
h1{font-size:1.25rem;color:var(--green);margin:0;}
.muted{color:var(--muted);font-size:.88rem;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.9rem;margin-top:8px;}
.btn{background:#252b38;color:var(--text);border:1px solid var(--border);border-radius:11px;padding:11px 13px;font-size:.9rem;margin:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn:active{background:#323a4a;}
.btn-green{background:#1b5e20;border-color:#2e7d32;}
.btn-orange{background:#e65100;border-color:#ef6c00;}
.btn-red{background:#b71c1c;border-color:#c62828;}
.btn-block{display:block;width:100%;margin:6px 0;text-align:center;}
#log{background:#0a0c11;border:1px solid var(--border);border-radius:12px;padding:12px;max-height:200px;overflow-y:auto;font-size:.88rem;margin-bottom:10px;white-space:pre-wrap;}
.log-sys{color:#81c784;}.log-bad{color:#ef9a9a;}.log-line{margin-bottom:5px;}
.hidden{display:none!important;}
.bar{position:fixed;bottom:0;left:0;right:0;background:#12151c;border-top:1px solid var(--border);padding:8px;display:flex;gap:5px;overflow-x:auto;z-index:40;}
.bar .btn{flex:0 0 auto;padding:9px 11px;font-size:.82rem;}
</style>
</head>
<body>
<div id="screen-title">
  <div class="card" style="text-align:center;margin-top:50px;">
    <h1>WorldLife: Unbound</h1>
    <p class="muted" style="margin:10px 0 18px;">Lagos • Prototype</p>
    <button class="btn btn-green btn-block" onclick="startLife()">Start New Life</button>
    <button class="btn btn-block" onclick="loadLife()">Continue</button>
  </div>
</div>
<div id="screen-game" class="hidden">
  <div class="card">
    <div class="row">
      <h1 id="p-name">Player</h1>
      <span class="muted" id="p-day">Day 1</span>
    </div>
    <div class="muted" id="p-loc" style="margin:3px 0 6px;">Location</div>
    <div class="grid2">
      <div>Money <strong id="p-money">₦0</strong></div>
      <div>HP <strong id="p-hp">100</strong></div>
      <div>Energy <strong id="p-energy">100</strong></div>
      <div>Wanted <strong id="p-wanted">0</strong></div>
    </div>
    <div class="muted" style="margin-top:6px;" id="p-extra"></div>
  </div>
  <div id="log"></div>
  <div class="card" id="actions"></div>
</div>
<div class="bar hidden" id="bar">
  <button class="btn" onclick="look()">Look</button>
  <button class="btn" onclick="showMap()">Map</button>
  <button class="btn" onclick="inv()">Inv</button>
  <button class="btn" onclick="shop()">Shop</button>
  <button class="btn" onclick="partyMenu()">Party</button>
  <button class="btn" onclick="ask()">Ask</button>
  <button class="btn" onclick="rest()">Rest</button>
  <button class="btn" onclick="save()">Save</button>
</div>
<script>
const LOCS={"Lagos Mainland - Street":{d:"Busy street. Okadas, generators, noise.",c:["Oshodi Motor Park","Balogun Market Area","Surulere","Local Buka","Food Market"]},"Oshodi Motor Park":{d:"Chaotic park. Agberos control the gates.",c:["Lagos Mainland - Street","Balogun Market Area","Ikeja"],npc:["Agbero Leader"]},"Balogun Market Area":{d:"Dense market. Deals and noise.",c:["Lagos Mainland - Street","Oshodi Motor Park","Lagos Island","Electronics Shop"]},"Food Market":{d:"Foodstuffs and provisions.",c:["Lagos Mainland - Street","Local Buka"],shop:1},"Victoria Island":{d:"Richer side of Lagos.",c:["Lagos Island","Ikoyi","Car Dealership","Luxury Shop"]},"Car Dealership":{d:"Used cars to Rolls Royce.",c:["Victoria Island"],shop:1},"Luxury Shop":{d:"High-end goods.",c:["Victoria Island"],shop:1},"Electronics Shop":{d:"Phones and gadgets.",c:["Balogun Market Area","Ikeja"],shop:1},"Lagos Island":{d:"Commercial island.",c:["Victoria Island","Balogun Market Area"]},"Surulere":{d:"Residential area.",c:["Lagos Mainland - Street","Local Buka","Small Shop"]},"Ikeja":{d:"Tech and movement.",c:["Oshodi Motor Park","Electronics Shop"]},"Ikoyi":{d:"Quiet and expensive.",c:["Victoria Island"]},"Local Buka":{d:"Local food joint.",c:["Lagos Mainland - Street","Surulere","Food Market"],shop:1},"Small Shop":{d:"Small shop front.",c:["Surulere"]},"Hospital":{d:"You can get treated here.",c:["Lagos Mainland - Street"]},"Police Station":{d:"Police station.",c:["Lagos Mainland - Street"]}};
const SHOPS={"Food Market":[{n:"Foodstuffs",p:8000},{n:"Water",p:500}],"Local Buka":[{n:"Plate of Food",p:3500},{n:"Water",p:600}],"Electronics Shop":[{n:"Used Phone",p:32000},{n:"Accessories",p:9000}],"Balogun Market Area":[{n:"Cheap Phone",p:12000},{n:"Fabric",p:20000}],"Car Dealership":[{n:"Used Car",p:2800000},{n:"Rolls Royce",p:92000000}],"Luxury Shop":[{n:"Luxury Watch",p:1350000}]};
const PLAYERS=["Kemi","Baba Tee","Chidi","Amaka","Oga Phil","Smallie","Fatima","Jay"];
let P=null,near=[],standing=0;
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function M(n){return "₦"+Number(n).toLocaleString();}
function show(id){["screen-title","screen-game"].forEach(s=>document.getElementById(s).classList.toggle("hidden",s!==id));document.getElementById("bar").classList.toggle("hidden",id!=="screen-game");}
function log(t,c){const e=document.getElementById("log");const d=document.createElement("div");d.className="log-line "+(c||"");d.textContent=t;e.appendChild(d);e.scrollTop=e.scrollHeight;}
function clearLog(){document.getElementById("log").innerHTML="";}
function refresh(){if(!P)return;document.getElementById("p-name").textContent=P.name;document.getElementById("p-day").textContent="Day "+P.day+" "+P.time;document.getElementById("p-loc").textContent=P.loc;document.getElementById("p-money").textContent=M(P.money);document.getElementById("p-hp").textContent=P.hp;document.getElementById("p-energy").textContent=P.en;document.getElementById("p-wanted").textContent=P.wanted;let extra=P.bg+" • Street "+P.street;if(P.party.length)extra+=" • Party: "+P.party.join(", ");document.getElementById("p-extra").textContent=extra;}
function acts(list){const a=document.getElementById("actions");a.innerHTML="";list.forEach(x=>{const b=document.createElement("button");b.className="btn "+(x.c||"");b.textContent=x.t;b.onclick=x.f;a.appendChild(b);});}
function birth(){const ages=[18,19,21,23,25,27,29,32,35,38,40];const bgs=["Street","Street","Middle Class","Middle Class","Nepo Baby","Orphan"];const names=["Tunde","Kemi","Chidi","Amaka","Sola","Bola","Emeka","Fatima","Jay","Smallie","Ngozi","Ifeanyi"];const genders=["Male","Female"];const name=names[R(0,names.length-1)];const age=ages[R(0,ages.length-1)];const bg=bgs[R(0,bgs.length-1)];const gender=genders[R(0,1)];P={name,age,bg,gender,loc:"Lagos Mainland - Street",money:0,hp:100,en:100,str:20,street:8,wanted:0,record:0,party:[],inv:[],quests:[],day:1,time:"Morning",deaths:0,equip:null};if(bg==="Street"){P.money=R(2500,11000);P.str=R(30,50);P.street=R(20,38);P.inv.push({n:"Kitchen Knife",v:3000,t:"weapon",d:8});P.equip=0;}else if(bg==="Middle Class"){P.money=R(55000,150000);P.str=R(16,32);P.street=R(9,20);P.inv.push({n:"Used Phone",v:25000,t:"elec"});}else if(bg==="Nepo Baby"){P.money=R(1200000,4200000);P.str=R(12,24);P.street=R(5,14);P.loc="Victoria Island";P.inv.push({n:"Phone",v:40000,t:"elec"});}else{P.money=R(500,3500);P.str=R(20,38);P.street=R(14,28);}return P;}
function startLife(){birth();clearLog();log("You were born into Lagos.","log-sys");log(P.name+", age "+P.age+", "+P.bg+" background.");log("The system decided your starting life. You did not choose.");log(LOCS[P.loc].d);show("screen-game");refresh();main();spawn();}
function loadLife(){const raw=localStorage.getItem("wl_save");if(!raw){alert("No save found.");return;}const d=JSON.parse(raw);P=d.P;standing=d.standing||0;clearLog();log("Continued.","log-sys");show("screen-game");refresh();main();spawn();}
function save(){localStorage.setItem("wl_save",JSON.stringify({P,standing}));log("Saved.","log-sys");}
function main(){const L=LOCS[P.loc];const b=[];(L.c||[]).forEach(x=>b.push({t:"Go → "+x,f:()=>go(x)}));if(L.npc&&L.npc.indexOf("Agbero Leader")>=0)b.push({t:"Talk to Agbero",c:"btn-orange",f:agbero});near.forEach(n=>{b.push({t:"Invite "+n,f:()=>invite(n)});b.push({t:"Talk "+n,f:()=>talk(n)});});b.push({t:"Find money",f:moneyTips});b.push({t:"Rob",c:"btn-red",f:rob});if(P.quests.length)b.push({t:"Do Quest",c:"btn-green",f:doQuest});acts(b);}
function spawn(){near=[];if(Math.random()<0.55){const s=PLAYERS.slice().sort(()=>Math.random()-0.5);near=s.slice(0,R(1,2));}}
function go(place){if(!LOCS[place])return;P.loc=place;P.en=Math.max(0,P.en-R(6,14));log(P.party.length?"You + party arrive at "+place:"Arrived: "+place);log(LOCS[place].d);timePass();spawn();refresh();main();if(P.en<=0){log("Exhausted. Rest.","log-bad");P.en=8;}}
function look(){const L=LOCS[P.loc];log(L.d);if(L.c)log("Ways: "+L.c.join(", "));if(near.length)log("People here: "+near.join(", "));if(P.party.length)log("Your party: "+P.party.join(", "));main();}
function showMap(){log("MAP","log-sys");Object.keys(LOCS).forEach(n=>log((n===P.loc?"→ ":"  ")+n));acts([{t:"Directions: Food Market",f:()=>dir("Food Market")},{t:"Directions: Car Dealership",f:()=>dir("Car Dealership")},{t:"Directions: Oshodi",f:()=>dir("Oshodi Motor Park")},{t:"Back",f:main}]);}
function dir(goal){const g={};Object.keys(LOCS).forEach(k=>g[k]=LOCS[k].c||[]);const q=[[P.loc,[P.loc]]],seen=new Set([P.loc]);let path=null;while(q.length){const [cur,pth]=q.shift();if(cur===goal){path=pth;break;}(g[cur]||[]).forEach(n=>{if(!seen.has(n)){seen.add(n);q.push([n,pth.concat(n)]);}});}if(!path){log("No route.");return;}log("Route to "+goal+":","log-sys");path.forEach((p,i)=>log((i?"→ ":"Start: ")+p));const b=path.slice(1).map(p=>({t:"Go "+p,f:()=>go(p)}));b.push({t:"Back",f:main});acts(b);}
function inv(){if(!P.inv.length){log("Empty.");main();return;}log("INVENTORY","log-sys");P.inv.forEach((it,i)=>log((i+1)+". "+it.n+(P.equip===i?" [EQUIPPED]":"")+"  "+M(it.v||0)));const b=P.inv.map((it,i)=>({t:"Sell "+it.n,f:()=>{const o=Math.floor((it.v||1000)*(0.5+Math.random()*0.55));if(confirm("Sell for "+M(o)+"?")){P.money+=o;P.inv.splice(i,1);if(P.equip===i)P.equip=null;log("Sold "+M(o));refresh();main();}}}));b.push({t:"Back",f:main});acts(b);}
function shop(){const cat=SHOPS[P.loc];if(!cat){log("Nothing sold here. Go to the right place.");log("Food→Food Market | Cars→Car Dealership | Phones→Electronics");main();return;}log("SHOP: "+P.loc,"log-sys");const b=cat.map(it=>({t:it.n+" — "+M(it.p),f:()=>{if(P.money<it.p){log("Not enough.");return;}P.money-=it.p;P.inv.push({n:it.n,v:it.p,t:"item"});log("Bought "+it.n);refresh();}}));b.push({t:"Back",f:main});acts(b);}
function partyMenu(){log(P.party.length?"Party: "+P.party.join(", "):"Alone.");const b=[];if(P.party.length)b.push({t:"Leave Party",c:"btn-red",f:()=>{P.party=[];log("Disbanded.");refresh();main();}});near.forEach(n=>{if(P.party.indexOf(n)<0)b.push({t:"Invite "+n,f:()=>invite(n)});});b.push({t:"Back",f:main});acts(b);}
function invite(n){if(P.party.indexOf(n)>=0)return;P.party.push(n);log(n+" joined your party.");refresh();main();}
function talk(n){log("You talk with "+n+".");acts([{t:"Invite",f:()=>invite(n)},{t:"Rob",c:"btn-red",f:()=>fight(n,R(25,48))},{t:"Back",f:main}]);}
function moneyTips(){log("Ways to make money:");log("• Oshodi + Agbero work");log("• Markets / sell items");log("• Riskier options");main();}
function rob(){if(P.en<18){log("Too tired.");return;}const ch=0.32+P.street/180+P.party.length*0.06;if(Math.random()<ch){let g=R(8000,52000);if(P.party.length)g=Math.floor(g*1.2);P.money+=g;P.wanted++;P.record++;P.en-=18;log("Robbery success +"+M(g),"log-sys");}else{log("Failed!","log-bad");fight("Target",R(22,45));}refresh();main();}
function fight(name,str){log("FIGHT vs "+name,"log-bad");let ehp=55;const bonus=(P.equip!=null&&P.inv[P.equip])?(P.inv[P.equip].d||0):0;const pb=P.party.length*4;function rnd(){if(P.hp<=0||ehp<=0){if(P.hp<=0){const lost=R(12000,60000);P.money=Math.max(0,P.money-lost);P.hp=28;P.en=25;P.deaths++;P.loc="Hospital";P.party=[];log("Down. Lost "+M(lost)+". Hospital.","log-bad");}else{const g=R(5000,32000);P.money+=g;log("Won +"+M(g),"log-sys");}refresh();main();return;}acts([{t:"Attack",f:()=>{const d=R(Math.max(5,P.str/3|0),(P.str/2|0)+7)+bonus+pb;ehp-=d;log("You hit "+d);if(ehp>0){const ed=R(4,(str/2|0)+5);P.hp-=ed;log(name+" hits "+ed);}refresh();rnd();}},{t:"Flee",f:()=>{if(Math.random()<0.42){log("Escaped");main();}else{P.hp-=R(4,14);log("Failed");refresh();rnd();}}},{t:"Back",f:main}]);}rnd();}
function agbero(){log("Agbero Leader.");acts([{t:"Work",f:()=>{let g=R(11000,32000);if(P.party.length)g=Math.floor(g*1.2);P.money+=g;standing+=6;log("Worked +"+M(g));refresh();main();}},{t:"Pay respect",f:()=>{const c=R(4000,14000);if(P.money>=c){P.money-=c;standing+=9;log("Paid.");}else log("Not enough.");refresh();main();}},{t:"Challenge",c:"btn-red",f:()=>fight("Agbero",R(28,48))},{t:"Back",f:main}]);}
function doQuest(){if(!P.quests.length){log("No quest.");return;}const q=P.quests[0];const r=Math.floor(q.r*(1+P.party.length*0.15));P.money+=r;log("Quest done: "+q.t+" +"+M(r),"log-sys");P.quests.shift();refresh();main();}
function rest(){P.en=Math.min(100,P.en+50);P.hp=Math.min(100,P.hp+12);P.day++;P.time="Morning";log("New day.","log-sys");if(Math.random()<0.4){const q={t:"Package Run",r:R(14000,38000)};P.quests.push(q);log("[Quest] "+q.t+" — "+M(q.r));}refresh();main();}
function timePass(){const o=["Morning","Afternoon","Evening","Night"];const i=o.indexOf(P.time);if(i===3){P.time="Morning";P.day++;}else P.time=o[i+1];}
function ask(){log("Operators:","log-sys");acts([{t:"How to make money?",f:moneyTips},{t:"Where to buy food?",f:()=>{log("Food Market or Local Buka.");dir("Food Market");}},{t:"Where to buy car/Rolls?",f:()=>{log("Car Dealership.");dir("Car Dealership");}},{t:"How party works?",f:()=>{log("Invite people when they appear. They travel with you.");main();}},{t:"Back",f:main}]);}
show("screen-title");
</script>
</body>
</html>
